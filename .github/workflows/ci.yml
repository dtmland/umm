name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure python3 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command python3 -ErrorAction SilentlyContinue)) {
            $python = (Get-Command python).Source
            $dir = Join-Path $env:RUNNER_TEMP 'python3-shim'
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Copy-Item $python (Join-Path $dir 'python3.exe')
            Add-Content -Path $env:GITHUB_PATH -Value $dir
          }

      - name: Run build-contract tests
        run: python3 -m unittest discover -s tests/build -v

      - name: Load pins
        shell: bash
        run: sh tools/build/pins.sh

      - name: Install Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          packages=$(grep -E -v '^[[:space:]]*(#|$)' tools/build/linux-packages.txt)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $packages

      - name: Setup Ninja
        if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Enable MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache libumm backend downloads
        uses: actions/cache@v4
        with:
          path: build/default/_deps/libumm-src/.cache
          key: ${{ runner.os }}-${{ env.UMM_LIBUMM_VERSION }}-${{ env.UMM_LIBUMM_SHA256 }}

      - name: Configure
        run: cmake --preset default -DUMM_REQUIRE_EXIV2=ON -DUMM_REQUIRE_EXIFTOOL=ON

      - name: Report acquired backends
        shell: bash
        run: cat build/default/backends-acquired.txt

      - name: Build
        run: cmake --build --preset default

      - name: Test
        run: ctest --preset default

  system-libumm:
    name: system-libumm (ubuntu-24.04)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run build-contract tests
        run: python3 -m unittest discover -s tests/build -v

      - name: Load pins
        shell: bash
        run: sh tools/build/pins.sh

      - name: Install Linux packages
        shell: bash
        run: |
          set -eu
          packages=$(grep -E -v '^[[:space:]]*(#|$)' tools/build/linux-packages.txt)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $packages

      - name: Build and install pinned libumm to a prefix
        shell: bash
        run: |
          set -eu
          curl -fsSL "$UMM_LIBUMM_URL" -o "$RUNNER_TEMP/libumm.tar.gz"
          echo "$UMM_LIBUMM_SHA256  $RUNNER_TEMP/libumm.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/libumm-src"
          tar -xzf "$RUNNER_TEMP/libumm.tar.gz" -C "$RUNNER_TEMP/libumm-src" --strip-components=1
          cmake -S "$RUNNER_TEMP/libumm-src" -B "$RUNNER_TEMP/libumm-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DUMM_BUILD_TESTS=OFF \
            -DUMM_REQUIRE_EXIV2=ON -DUMM_REQUIRE_EXIFTOOL=ON \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/libumm-prefix"
          cmake --build "$RUNNER_TEMP/libumm-build"
          cmake --install "$RUNNER_TEMP/libumm-build"

      - name: Configure against installed libumm
        run: cmake --preset default -DUMM_CLI_USE_SYSTEM_LIBUMM=ON -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/libumm-prefix"

      - name: Build
        run: cmake --build --preset default

      - name: Test
        run: ctest --preset default
